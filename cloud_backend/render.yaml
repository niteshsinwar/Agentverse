# Render.com Blueprint for AgentVerse Cloud Backend
# https://render.com/docs/blueprint-spec

services:
  # Django Web Service
  - type: web
    name: agentverse-cloud
    runtime: python
    region: oregon
    plan: starter  # Upgrade to standard/pro for production
    branch: main
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --threads 2 --timeout 120"
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: agentverse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: agentverse-redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: agentverse-cloud.onrender.com,*.agentverse.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://app.agentverse.com,http://localhost:1420
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      # Email
      - key: SENDGRID_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: DEFAULT_FROM_EMAIL
        value: noreply@agentverse.com
      # Storage
      - key: MINIO_ENDPOINT
        sync: false  # Set to your MinIO/S3 endpoint
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET_NAME
        value: agentverse-documents
      # Vector DB
      - key: QDRANT_HOST
        sync: false  # Set to your Qdrant instance
      - key: QDRANT_PORT
        value: 6333
      - key: QDRANT_API_KEY
        sync: false
      # Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # Celery Worker
  - type: worker
    name: agentverse-worker
    runtime: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: "./build.sh"
    startCommand: "celery -A config worker --loglevel=info --concurrency=2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: agentverse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: agentverse-redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        sync: false  # Share same secret as web service
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings

  # Celery Beat (Periodic Tasks)
  - type: worker
    name: agentverse-beat
    runtime: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: "./build.sh"
    startCommand: "celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: agentverse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: agentverse-redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings

databases:
  # PostgreSQL Database
  - name: agentverse-db
    databaseName: agentverse_cloud
    plan: starter  # $7/month, upgrade to standard for production
    region: oregon
    ipAllowList: []  # Empty = allow all (Render services only by default)

  # Redis Cache & Channels
  - name: agentverse-redis
    plan: starter  # $10/month
    region: oregon
    maxmemoryPolicy: allkeys-lru  # Evict least recently used keys
    ipAllowList: []
